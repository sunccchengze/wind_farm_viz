<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>热力矩阵 · 风电场偏航优化</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script><script src="assets/js/plotly-theme.js" defer></script>
</head>
<body>
<nav><div class="nav-inner"><div class="brand">风电场偏航优化<br><span style="font-size:11px;color:var(--sub)">可视化模块</span></div>
<div class="nav-links"></div></div></nav>
<section class="wrap pg-hero"><h1>🔥 热力矩阵</h1><p>偏航角 × 风速功率增益矩阵，覆盖 6~12 m/s 全风速</p></section>
<main class="wrap">
  <div class="card">
    <div id="heatPlot" class="plotly-container" style="height:500px"></div>
    <div class="note">偏航角 × 风速功率增益热力图。颜色越亮增益越大。</div>
  </div>
  <div class="grid2" style="margin-top:18px">
    <div class="card">
      <div class="controls"><label>选择风速</label><select id="wsSel"></select></div>
      <div id="slicePlot" class="plotly-container" style="height:300px"></div>
      <div class="note">选定风速下的增益曲线（%）。</div>
    </div>
    <div class="card">
      <div class="controls"><label>选择偏航角</label><select id="yawSel"></select></div>
      <div id="yawSlicePlot" class="plotly-container" style="height:300px"></div>
      <div class="note">选定偏航角下增益随风速变化（%）。</div>
    </div>
  </div>
</main>
<footer class="wrap">孙承泽 · 可视化模块</footer>
<script src="assets/data.js"></script><script src="assets/data_3d.js"></script>
<script>
(function(){
  const D3=window.WIND_3D_DATA,hm=D3&&D3.heatmap,W=window.WIND_DATA,m=W.multi,BSM=window.BlueSeqMid;
  let ws,yas,gain;
  if(hm&&hm.gain_pct&&hm.gain_pct.length>0){ws=hm.wind_speeds;yas=hm.yaw_angles;gain=hm.gain_pct;}
  else{ws=m.wind_speeds;yas=m.yaw_angles;gain=ws.map((u,i)=>yas.map((y,j)=>{const base=m.ptot[i][yas.indexOf(0)];return base>0?((m.ptot[i][j]-base)/base*100):0;}));}
  pr('heatPlot',[{type:'heatmap',x:ws.map(u=>u+' m/s'),y:yas.map(y=>y+'°'),z:gain,colorscale:BSM,
    hovertemplate:'风速 %{x}  偏航 %{y}  增益 %{z:.2f}%<extra></extra>',
    colorbar:{title:{text:'增益 (%)',side:'right'},thickness:15,len:0.85,x:1.02}}],
    {xaxis:{title:'来流风速 (m/s)'},yaxis:{title:'上游偏航角 (°)'},height:500,margin:{l:60,r:70,t:20,b:50}});
  const wsSel=document.getElementById('wsSel');
  ws.forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=u+' m/s';wsSel.appendChild(o);});wsSel.value=8;
  function renderWsSlice(){const u=parseFloat(wsSel.value),i=ws.indexOf(u);if(i<0)return;const g=gain[i],optIdx=g.indexOf(Math.max(...g));
    pr('slicePlot',[{x:yas,y:g,mode:'lines+markers',name:'增益',line:{color:'#38bdf8',width:2.5},marker:{size:6,color:'#38bdf8'},fill:'tozeroy',fillcolor:'rgba(56,189,248,0.08)'}],
      {xaxis:{title:'偏航角 (°)'},yaxis:{title:'增益 (%)',zeroline:true,zerolinecolor:'#475569'},height:300,
        annotations:[{x:yas[optIdx],y:g[optIdx],text:'最优 '+yas[optIdx]+'°',showarrow:true,arrowhead:2,arrowcolor:'#22d3ee',font:{color:'#22d3ee',size:11},ax:0,ay:-25}]});}
  wsSel.onchange=renderWsSlice;renderWsSlice();
  const yawSel=document.getElementById('yawSel');
  yas.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y+'°';yawSel.appendChild(o);});yawSel.value=25;
  function renderYawSlice(){const y=parseFloat(yawSel.value),j=yas.indexOf(y);if(j<0)return;const g=ws.map((_,i)=>gain[i][j]);
    pr('yawSlicePlot',[{x:ws,y:g,mode:'lines+markers',name:'增益',line:{color:'#22d3ee',width:2.5},marker:{size:6,color:'#22d3ee'},fill:'tozeroy',fillcolor:'rgba(34,211,238,0.08)'}],
      {xaxis:{title:'风速 (m/s)'},yaxis:{title:'增益 (%)',zeroline:true,zerolinecolor:'#475569'},height:300});}
  yawSel.onchange=renderYawSlice;renderYawSlice();
})();
</script>
<script src="assets/js/nav.js"></script>
</body></html>
