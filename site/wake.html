<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>尾流分析 · 风电场偏航优化</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script><script src="assets/js/plotly-theme.js" defer></script>
</head>
<body>
<nav><div class="nav-inner"><div class="brand">风电场偏航优化<br><span style="font-size:11px;color:var(--sub)">可视化模块</span></div>
<div class="nav-links"></div></div></nav>
<section class="wrap pg-hero"><h1>📊 尾流分析</h1><p>交互式速度场云图，代理模型实时预测任意偏航角下的功率输出</p></section>
<main class="wrap">
  <div class="stats-bar" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-card"><p class="stat-number" id="kP1">–</p><p class="stat-label">上游风机 P₁ (kW)</p></div>
    <div class="stat-card"><p class="stat-number" id="kP2">–</p><p class="stat-label">下游风机 P₂ (kW)</p></div>
    <div class="stat-card"><p class="stat-number" id="kPtot">–</p><p class="stat-label">总功率 (kW)</p></div>
    <div class="stat-card"><p class="stat-number" id="kGain">–</p><p class="stat-label">相对基准增益</p></div>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="controls">
        <label>偏航角 γ₁</label>
        <input type="range" id="yawSlider" min="-30" max="30" value="0" step="5" style="width:200px">
        <span id="yawLabel" style="font-size:14px;font-weight:700;color:var(--blue)">0°</span>
      </div>
      <div id="fieldPlot" class="plotly-container" style="height:420px"></div>
      <div class="note">尾流速度场（FLORIS GCH 模型）。拖动偏航角滑块实时观察流场变化。</div>
    </div>
    <div class="card">
      <div id="powerPlot" class="plotly-container" style="height:210px"></div>
      <div id="splitPlot" class="plotly-container" style="height:210px;margin-top:12px"></div>
      <div class="note">上：总功率 vs 偏航角，亮点为当前；下：P₁/P₂ 分解。</div>
    </div>
  </div>
</main>
<footer class="wrap">孙承泽 · 可视化模块</footer>
<script src="assets/data.js"></script><script src="assets/data_3d.js"></script><script src="assets/js/interp.js"></script>
<script>
(function(){
  const W=window.WIND_DATA,S=window.SURROGATE,D3=window.WIND_3D_DATA,BS=window.BlueSeq;
  const m=W.multi,yawSlider=document.getElementById('yawSlider'),yawLabel=document.getElementById('yawLabel');
  function nearestYaw(v){return m.yaw_angles.reduce((p,c)=>Math.abs(c-v)<Math.abs(p-v)?c:p);}
  function render(){
    const yaw=parseInt(yawSlider.value);yawLabel.textContent=yaw+'°';
    const pred=S.predict_power(yaw,8),base=S.predict_power(0,8);
    const gain=((pred.ptot-base.ptot)/base.ptot*100);
    document.getElementById('kP1').textContent=Math.round(pred.p1);
    document.getElementById('kP2').textContent=Math.round(pred.p2);
    document.getElementById('kPtot').textContent=Math.round(pred.ptot);
    document.getElementById('kGain').textContent=(gain>=0?'+':'')+gain.toFixed(1)+'%';
    const f2d=D3&&D3.fields_2d&&D3.fields_2d[String(yaw)];
    if(f2d){
      pr('fieldPlot',[{type:'heatmap',x:f2d.x,y:f2d.y,z:f2d.u,colorscale:BS,zmin:4,zmax:9,
        colorbar:{title:{text:'m/s',side:'right'},thickness:12,len:0.8,x:1.02},
        hovertemplate:'x: %{x:.0f}m  y: %{y:.0f}m  u: %{z:.2f} m/s<extra></extra>'},
      {type:'scatter',x:[0,630],y:[0,0],mode:'markers+text',
        marker:{size:14,color:'#e2e8f0',symbol:'triangle-up',line:{color:'#1e3a6e',width:1.5}},
        text:['  风机1(可调)','  风机2(固定0°)'],textposition:'middle right',
        textfont:{size:11,color:'#e2e8f0'},showlegend:true,name:'风机位置'}],
      {xaxis:{title:'顺风方向 x (m)'},yaxis:{title:'横向 y (m)'},height:420,margin:{l:50,r:60,t:20,b:50},
        legend:{orientation:'h',y:-0.15,x:0,font:{size:10}}});
    }
    const i8=m.wind_speeds.indexOf(8);
    const optIdx=m.ptot[i8].indexOf(Math.max(...m.ptot[i8]));
    pr('powerPlot',[{x:m.yaw_angles,y:m.ptot[i8],mode:'lines',name:'总功率',
      line:{color:'#38bdf8',width:2.5},fill:'tozeroy',fillcolor:'rgba(56,189,248,0.06)'},
    {x:[yaw],y:[pred.ptot],mode:'markers',name:'当前 '+yaw+'°',
      marker:{size:14,color:'#e0f2fe',line:{color:'#0f172a',width:2}}}],
    {xaxis:{title:'偏航角 (°)'},yaxis:{title:'总功率 (kW)'},height:210,margin:{l:50,r:15,t:10,b:40},showlegend:false,
      annotations:[{x:m.yaw_angles[optIdx],y:m.ptot[i8][optIdx],text:'最优 '+m.yaw_angles[optIdx]+'°',
        showarrow:true,arrowhead:2,arrowcolor:'#22d3ee',font:{color:'#22d3ee',size:11},ax:0,ay:-30}]});
    pr('splitPlot',[{x:m.yaw_angles,y:m.p1[i8],mode:'lines',name:'上游 P₁',line:{color:'#818cf8',width:2}},
    {x:m.yaw_angles,y:m.p2[i8],mode:'lines',name:'下游 P₂',line:{color:'#60a5fa',width:2}}],
    {xaxis:{title:'偏航角 (°)'},yaxis:{title:'功率 (kW)'},height:210,margin:{l:50,r:15,t:10,b:40},
      legend:{orientation:'h',y:-0.35,x:0,font:{size:10}},
      shapes:[{type:'line',x0:yaw,x1:yaw,y0:0,y1:1,yref:'paper',line:{color:'#a5b4fc',width:1.5,dash:'dot'}}]});
  }
  yawSlider.oninput=render;render();
})();
</script>
<script src="assets/js/nav.js"></script>
</body></html>
